<!-- scroll-1.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스크롤 동적 js</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/scroll-1.css">
    <script src="./scripts/scroll-1.js" defer></script>
</head>
<body id ="body_pst">
    <div class="popup"><!-- 두개이상의 요소가 들어올 것을 예상하고 div로 감싸기 -->
        <a href="#body_pst" class="top">↑</a><!-- 유지보수어려움. -->
    </div>
    <!-- 상품상세 탭 시작 -->
    <main>
        <div class="thumnail">상품내용</div>
        <div class="category_title">
            <a href="#" data-index="0" class="active">상품상세</a><!-- data- 보안과 관련된 내용은 붙이면 그대로 노출되기때문에 주의해야함! -->
            <a href="#" data-index="1">리뷰</a>
            <a href="#" data-index="2">추천</a>
            <a href="#" data-index="3">반품안내</a>
        </div>
        <div class="category_contents">
            <section class="product"><h1>상세</h1><img src="" alt=""></section>
            <section class="review"><h1>리뷰</h1><!-- ul>li*2 --></section>
            <section class="recommend"><h1>추천</h1><!-- swiper --></section>
            <section class="refund"><h1>반품</h1><!-- dl>dt+dd --></section>
        </div>
    </main>
</body>
</html>
